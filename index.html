<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1f1a"><title>Orc Attack — Medieval Tower Defence</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;font-family:Georgia,'Times New Roman',serif;color:#f3e6c8;touch-action:none}
#gl canvas{display:block;position:fixed;inset:0}
.btn{font-family:inherit;border:2px solid #a07a3a;background:linear-gradient(#5a3f22,#3a2814);color:#f6e7c1;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #1a1008,inset 0 1px 0 #8a6a3a;min-height:40px;min-width:40px}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;filter:grayscale(.6)}
.btn.on{background:linear-gradient(#8a5a1a,#5a3a10);border-color:#e0b050}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(rgba(20,12,8,.85),rgba(20,12,8,0));pointer-events:none;flex-wrap:wrap}
#hud .stat{background:rgba(30,20,12,.8);border:1px solid #6a4a24;border-radius:9px;padding:5px 9px;font-size:16px;font-weight:bold;display:flex;align-items:center;gap:6px}
#hud .btn{pointer-events:auto;padding:4px 8px;min-height:36px}
.ico{display:inline-block;width:14px;height:14px;border-radius:50%}
.ico.g{background:radial-gradient(circle at 35% 35%,#fff3a0,#e0a020 55%,#7a5008)}
.ico.l{background:radial-gradient(circle at 35% 35%,#ff9a9a,#c81e1e 55%,#5a0808);border-radius:3px 50% 50% 50%;transform:rotate(45deg) scale(.85)}
.ico.w{background:radial-gradient(circle at 35% 35%,#c0e0ff,#4a6aa0 60%,#1a2a50)}
#sp{flex:1}
#bWave{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:17px;padding:12px 16px;z-index:5}
#bWave.early{background:linear-gradient(#3a5a22,#22380f);border-color:#8ac050}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);background:rgba(28,18,10,.95);border:2px solid #8a6430;border-bottom:none;border-radius:16px 16px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:6;transition:transform .18s}
#sheet.hidden{display:none}
#sheet h3{margin:0 0 8px;font-size:17px;color:#ffd890;display:flex;justify-content:space-between;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:13px}
.tb canvas{width:44px;height:44px}
.tb small{font-weight:normal;color:#e8d8a8;font-size:11px;line-height:1.1;text-align:center}
.cost{color:#ffd040}
.row{display:flex;gap:8px;margin-top:6px}.row .btn{flex:1}
.stats{font-size:14px;color:#e8d8b0;line-height:1.5}
.pips span{display:inline-block;width:12px;height:12px;border-radius:50%;background:#3a2a1a;border:1px solid #a07a3a;margin-right:3px}.pips span.f{background:#ffc840}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:34px;font-weight:bold;color:#ffe0a0;text-shadow:0 3px 0 #000,0 0 20px #a04000;pointer-events:none;opacity:0;transition:opacity .4s;z-index:4;padding:0 10px}
#banner.show{opacity:1}#banner small{display:block;font-size:18px;color:#ffb0a0}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(30,15,8,.55),rgba(10,5,2,.9));z-index:10;text-align:center;padding:20px}
.screen.hidden{display:none}
#title{background:#120a05;overflow:hidden;justify-content:flex-end;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#titleBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:-2}
#title::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(8,4,2,.55),rgba(8,4,2,.1) 28%,rgba(8,4,2,.35) 50%,rgba(8,4,2,.92) 82%)}
#title{isolation:isolate}#title p{text-shadow:0 2px 4px #000}
.screen h1{font-size:clamp(38px,9vw,76px);margin:0;color:#ffd27a;letter-spacing:2px;text-shadow:0 4px 0 #4a1a00,0 0 30px #c04000}
.screen h2{font-size:clamp(28px,6vw,48px);margin:0;color:#ffd27a;text-shadow:0 3px 0 #000}
.screen p{margin:0;max-width:520px;color:#e8d6b0;font-size:15px;line-height:1.45}
.screen .btn{font-size:20px;padding:12px 28px;min-width:220px}
#floaters{position:fixed;top:54px;left:10px;pointer-events:none;z-index:4}
.fl{font-weight:bold;color:#ffd040;text-shadow:0 2px 0 #000;animation:fl 1.4s forwards;font-size:16px}
@keyframes fl{to{transform:translateY(-24px);opacity:0}}
#flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(255,0,0,.0);transition:box-shadow .3s;z-index:3}
#hint{position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:12px;color:#d8c8a0;opacity:.8;pointer-events:none;max-width:55%}
body.menu #hud,body.menu #bWave,body.menu #hint{display:none}
</style></head><body class="menu">

function gameOver(win){if(G.state!=='play')return;G.state=win?'won':'lost';AU.setIntensity(0);AU.play(win?'win':'lose');saveBest(win?G.wave:G.wave-1);
 $('overT').textContent=win?'Victory! The Orc Attack Is Broken':'The Orcs Have Taken the Keep';$('overP').textContent=(win?'All '+WIN_WAVE+' waves repelled. ':'You held until wave '+G.wave+'. ')+G.stats.kills+' orcs slain. Best wave: '+G.best+'.';
 $('bCont').style.display=win?'':'none';$('over').classList.remove('hidden');closeSheet();}
// ---------- UI ----------
function floater(t){const d=document.createElement('div');d.className='fl';d.textContent=t;const F=$('floaters');F.appendChild(d);while(F.children.length>3)F.firstChild.remove();setTimeout(()=>d.remove(),1400);}
let bannerT=null;function banner(t,s){const b=$('banner');b.innerHTML=t+(s?'<small>'+s+'</small>':'');b.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),2200);}
let lastUI='';
function ui(){const busy=G.queues.length>0||G.enemies.length>0;const done=!G.endless&&G.wave>=WIN_WAVE;
 const key=[G.gold,G.lives,G.wave,busy,G.speed,G.paused,AU.isMuted(),done].join();if(key===lastUI)return;lastUI=key;
 $('gold').textContent=G.gold;$('lives').textContent=G.lives;$('wave').textContent=G.wave+(G.endless?'':'/'+WIN_WAVE);
 const bw=$('bWave');bw.style.display=done&&busy?'none':'';bw.classList.toggle('early',busy);bw.textContent=busy?'Next wave early +'+(10+G.wave*2):'Start Wave '+(G.wave+1)+(isBoss(G.wave+1)?' (BOSS)':'');
 $('bSpeed').textContent=G.speed+'x';$('bPause').textContent=G.paused?'▶':'II';$('bPause').classList.toggle('on',G.paused);$('bMute').classList.toggle('on',AU.isMuted());$('bMute').textContent=AU.isMuted()?'♪̸':'♪';
 if(G.sel)renderSheet();}
const iconCache={};
function towerIcon(type){if(iconCache[type])return iconCache[type];const c=document.createElement('canvas');c.width=c.height=88;const x=c.getContext('2d');x.translate(44,44);x.lineWidth=5;x.strokeStyle='#f3e0b0';x.fillStyle=TT[type].col;x.beginPath();x.arc(0,0,40,0,7);x.fill();
 if(type==='archer'){x.beginPath();x.arc(-6,0,24,-1.2,1.2);x.stroke();x.beginPath();x.moveTo(3,-22);x.lineTo(3,22);x.lineWidth=2;x.stroke();x.lineWidth=4;x.beginPath();x.moveTo(-14,0);x.lineTo(26,0);x.stroke();x.beginPath();x.moveTo(26,0);x.lineTo(18,-6);x.lineTo(18,6);x.fill();x.fillStyle='#f3e0b0';x.fill();}
 if(type==='catapult'){x.fillStyle='#f3e0b0';x.fillRect(-24,14,48,6);x.save();x.rotate(-0.7);x.fillRect(-3,-28,6,40);x.restore();x.beginPath();x.arc(-18,-18,9,0,7);x.fill();}
 if(type==='cannon'){x.fillStyle='#f3e0b0';x.save();x.rotate(-0.4);x.fillRect(-22,-8,40,16);x.restore();x.beginPath();x.arc(-6,14,10,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(16,-8,5,0,7);x.fill();}
 if(type==='wizard'){x.fillStyle='#f3e0b0';x.beginPath();x.moveTo(0,-30);x.lineTo(12,-6);x.lineTo(0,4);x.lineTo(-12,-6);x.closePath();x.fill();x.strokeStyle='#ffe060';x.lineWidth=4;x.beginPath();x.moveTo(-4,6);x.lineTo(6,16);x.lineTo(-2,20);x.lineTo(8,32);x.stroke();}
 return iconCache[type]=c.toDataURL();}
function openSheet(pad){G.sel=pad;renderSheet();$('sheet').classList.remove('hidden');}
function closeSheet(){G.sel=null;$('sheet').classList.add('hidden');showRange(0,0,0);}
function renderSheet(){const p=G.sel,s=$('sheet');if(!p)return;const t=p.tower;
 if(!t){showRange(p.x,p.z,0);s.innerHTML='<h3>'+(p.y?'Wall platform: +15% range':'Build on ruins')+'<button class="btn" data-a="x">✕</button></h3><div class="grid4">'+Object.keys(TT).map(k=>{const T=TT[k];return `<button class="btn tb" data-b="${k}" ${G.gold<T.cost?'disabled':''}><img src="${towerIcon(k)}" width="44" height="44" alt=""><span>${T.name.split(' ')[0]}</span><span class="cost">${T.cost}g</span><small>${T.desc}</small></button>`;}).join('')+'</div>';}
 else{const S=stat(t),T=t.T;showRange(t.x,t.z,S.range,t.pad.y);const up=t.lvl<2?T.up[t.lvl+1]:0;const N=t.lvl<2?T.lv[t.lvl+1]:null;
  let st=`Damage <b>${S.dmg}</b>${N?' → '+N.dmg:''} · Rate <b>${(1/S.rate).toFixed(1)}/s</b> · Range <b>${S.range}</b>${t.pad.y?' <span style="color:#9fe070">(+15% wall height)</span>':''}`;if(S.splash)st+=` · Splash ${S.splash}`;if(S.jumps)st+=` · Chains ${S.jumps} · Slow ${S.slow*100}%`;if(t.type==='cannon')st+=' · Pierces armour';if(t.type==='archer'&&t.lvl===2)st+=' · Twin archers';
  s.innerHTML=`<h3><span><img src="${towerIcon(t.type)}" width="22" height="22" style="vertical-align:middle"> ${T.name} <span class="pips">${[0,1,2].map(i=>'<span class="'+(i<=t.lvl?'f':'')+'"></span>').join('')}</span></span><button class="btn" data-a="x">✕</button></h3><div class="stats">${st}</div>
  <div class="row"><button class="btn" data-a="up" ${(!N||G.gold<up)?'disabled':''}>${N?'Upgrade '+up+'g':'Max level'}</button><button class="btn" data-a="sell">Sell +${Math.floor(t.spent*0.7)}g</button></div>`;}}
$('sheet').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;AU.play('click');const p=G.sel;if(!p)return;
 if(b.dataset.a==='x')return closeSheet();if(b.dataset.b){if(buildTower(p,b.dataset.b))renderSheet();ui();return;}
 if(b.dataset.a==='up'&&p.tower){upgradeTower(p.tower);renderSheet();ui();}if(b.dataset.a==='sell'&&p.tower){floater('Sold +'+sellTower(p.tower));closeSheet();ui();}});
$('bWave').onclick=()=>{AU.resume();startWave();};
$('bSpeed').onclick=()=>{G.speed=G.speed>=3?1:G.speed+1;AU.play('click');ui();};
$('bPause').onclick=()=>{G.paused=!G.paused;AU.play('click');ui();};
$('bMute').onclick=()=>{AU.resume();AU.setMuted(!AU.isMuted());ui();};
function begin(endless){AU.resume();AU.music(true);document.body.classList.remove('menu');$('title').classList.add('hidden');$('over').classList.add('hidden');resetGame(endless);fitCam(true);setTimeout(()=>{$('hint').style.display='none';},9000);}
$('bPlay').onclick=()=>begin(false);$('bEndless').onclick=()=>begin(true);$('bAgain').onclick=()=>begin(G.endless);
$('bCont').onclick=()=>{$('over').classList.add('hidden');G.state='play';G.endless=true;lastUI='';ui();};
$('bMenu').onclick=()=>{$('over').classList.add('hidden');$('title').classList.remove('hidden');document.body.classList.add('menu');G.state='title';showBest();};
function showBest(){$('best').textContent=G.best?'Best wave reached: '+G.best:'';}showBest();
document.addEventListener('keydown',e=>{if(G.state!=='play')return;if(e.key===' '){startWave();e.preventDefault();}if(e.key==='p')$('bPause').onclick();if(e.key>='1'&&e.key<='3'){G.speed=+e.key;ui();}if(e.key==='Escape')closeSheet();});
// ---------- camera + input ----------
const cam={tx:0,tz:0,yaw:0,pitch:0.92,dist:48};
function fitCam(reset){const portrait=innerHeight>innerWidth*1.1;if(reset){cam.yaw=portrait?Math.PI/2:0;cam.tx=portrait?2:2.5;cam.tz=portrait?0:1.5;cam.pitch=portrait?1.05:0.9;}
 const a=innerWidth/innerHeight;const halfW=portrait?19:30;if(reset)cam.dist=Math.max(30,Math.min(100,halfW/(0.414*a)*(portrait?1.0:1.12)));}
function applyCam(){const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);camera.position.set(cam.tx+Math.sin(cam.yaw)*cp*cam.dist,sp*cam.dist,cam.tz+Math.cos(cam.yaw)*cp*cam.dist);camera.lookAt(cam.tx,0,cam.tz);}
const cv=renderer.domElement,ptrs=new Map();let gest=null,downInfo=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});if(ptrs.size===1)downInfo={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,b:e.button};else downInfo&&(downInfo.moved=99);gest=null;AU.resume();});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(downInfo)downInfo.moved+=Math.abs(dx)+Math.abs(dy);
 if(ptrs.size===1){if(p.b===2||e.shiftKey){cam.yaw-=dx*0.006;cam.pitch=Math.min(1.4,Math.max(0.42,cam.pitch+dy*0.004));}else{const k=cam.dist*0.0021;const rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw),fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw);cam.tx-=(rx*dx-fx*dy)*k;cam.tz-=(rz*dx-fz*dy)*k;clampCam();}}
 else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),ang=Math.atan2(b.y-a.y,b.x-a.x),my=(a.y+b.y)/2;if(gest){cam.dist=Math.min(95,Math.max(16,cam.dist*gest.d/d));let da=ang-gest.a;da=Math.atan2(Math.sin(da),Math.cos(da));cam.yaw+=da;cam.pitch=Math.min(1.4,Math.max(0.42,cam.pitch+(my-gest.my)*0.004));}gest={d,a:ang,my};}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);gest=null;if(ptrs.size===0&&downInfo){if(downInfo.moved<12&&performance.now()-downInfo.t<600&&downInfo.b!==2)tap(e.clientX,e.clientY);downInfo=null;}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{cam.dist=Math.min(95,Math.max(16,cam.dist*(1+Math.sign(e.deltaY)*0.1)));e.preventDefault();},{passive:false});
function clampCam(){cam.tx=Math.max(-30,Math.min(30,cam.tx));cam.tz=Math.max(-20,Math.min(20,cam.tz));}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.3),hitP=new THREE.Vector3();
function tap(cx,cy){if(G.state!=='play')return;ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
 let best=null,bd=2.2;for(const p of PADS){plane.constant=-(p.y+0.3);if(!ray.ray.intersectPlane(plane,hitP))continue;const d=Math.hypot(p.x-hitP.x,p.z-hitP.z)-(p.y?0.3:0);if(d<bd){bd=d;best=p;}}
 if(best){AU.play('click');openSheet(best);}else closeSheet();}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();fitCam(G.state!=='play');});
// ---------- loop ----------
let lastT=performance.now(),uiAcc=0;fitCam(true);renderer.shadowMap.needsUpdate=true;
function frame(now){requestAnimationFrame(frame);const raw=(now-lastT)/1000;lastT=now;const rdt=Math.min(0.05,raw);if(raw>0)G.fps=G.fps*0.92+Math.min(240,1/raw)*0.08;
 if(G.state==='play'&&!G.paused){let gdt=rdt*G.speed;while(gdt>1e-6){const d=Math.min(gdt,1/30);step(d);gdt-=d;}}
 else if(G.state==='title'){cam.yaw+=rdt*0.05;}
 envUpdate(rdt,now/1000);
 if(keepFlash>0){keepFlash-=rdt;KEEPV.emissive.setRGB(Math.max(0,keepFlash)*0.8,0,0);}
 for(const p of PADS)if(p.ring.visible)p.ring.material.opacity=0.25+Math.sin(now/400)*0.1;
 uiAcc+=rdt;if(uiAcc>0.15){uiAcc=0;ui();}
 applyCam();renderer.render(scene,camera);}
requestAnimationFrame(frame);
// ---------- test hooks ----------
window.__TD={G,PADS,TT,ET,cam,begin,startWave,buildTower,upgradeTower,sellTower,openSheet,closeSheet,applyCam,fitCam,
 sim(sec){let t=sec;while(t>0&&G.state==='play'){const d=Math.min(t,1/30);step(d);t-=d;}ui();},
 render(){applyCam();renderer.render(scene,camera);},info:()=>renderer.info.render,
 autoBuild(){const order=['archer','cannon','wizard','catapult'];const pads=PADS.slice().sort((a,b)=>(b.y-a.y)||Math.abs(a.x)-Math.abs(b.x));let i=G.towers.length;let changed=true;
  while(changed){changed=false;const lowest=G.towers.slice().sort((a,b)=>a.lvl-b.lvl)[0];if(lowest&&lowest.lvl<2&&G.towers.length>=6&&G.gold>=lowest.T.up[lowest.lvl+1]){upgradeTower(lowest);changed=true;continue;}
   const p=pads.find(p=>!p.tower);if(!p)break;const ty=order[G.towers.length%4];if(G.gold>=TT[ty].cost){buildTower(p,ty);changed=true;}}}};
</script>
